name: Compila APK Linea Verde

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configura Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Estrai il progetto ZIP
      run: |
        sudo apt-get install -y unzip
        unzip green-overlay-android-kotlin.zip -d progetto_estratto
        # Sposta i file nella cartella principale se l'estrazione ha creato una sottocartella
        cp -r progetto_estratto/*/* . || cp -r progetto_estratto/* . || true

    - name: Dai i permessi a Gradle
      run: chmod +x gradlew
      continue-on-error: true

    - name: Compila APK di Debug
      run: ./gradlew assembleDebug || gradle assembleDebug

    - name: Carica l'APK pronto
      uses: actions/upload-artifact@v4
      with:
        name: App-Linea-Verde-Installabile
        path: "**/build/outputs/apk/debug/*.apk"
