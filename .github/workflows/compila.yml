name: Compila APK Linea Verde

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configura Ambiente Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configura e Forza Gradle Ufficiale
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Crea Struttura se mancante
      run: |
        mkdir -p app/src/main/res/layout
        echo "include ':app'" > settings.gradle
        
        # build.gradle del Progetto
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF
        
        # build.gradle dell'App
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application'; id 'kotlin-android' }
        android {
            namespace 'com.example.lineaverde'
            compileSdk 34
            defaultConfig { applicationId 'com.example.lineaverde'; minSdk 26; targetSdk 34; versionCode 1; versionName '1.0' }
        }
        dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1' }
        EOF
        
        # AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android='http://android.com'>
            <uses-permission android:name='android.permission.SYSTEM_ALERT_WINDOW'/>
            <application android:label='Green Line Overlay' android:theme='@style/Theme.AppCompat.Light.NoActionBar'>
                <activity android:name='.MainActivity' android:exported='true'><intent-filter><action android:name='android.intent.action.MAIN' /><category android:name='android.intent.category.LAUNCHER' /></intent-filter></activity>
                <service android:name='.OverlayService' android:exported='false' />
            </application>
        </manifest>
        EOF
        
        # activity_main.xml Layout
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <LinearLayout xmlns:android='http://android.com' android:layout_width='match_parent' android:layout_height='match_parent' android:gravity='center'><Button android:id='@+id/btnStart' android:layout_width='match_parent' android:layout_height='wrap_content' android:text='ATTIVA LINEA VERDE'/></LinearLayout>
        EOF

    - name: Compila APK Eseguibile
      run: gradle assembleDebug

    - name: Carica l'APK Pronto da Installare
      uses: actions/upload-artifact@v4
      with:
        name: App-Linea-Verde-Installabile
        path: "**/build/outputs/apk/debug/*.apk"
